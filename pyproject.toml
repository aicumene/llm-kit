[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kit"
version = "0.1.0"
description = "Model providers behind a privacy-gated router, task dispatch with memoization, response shaping, token metering and token savers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexandra Bernadotte" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# AnthropicProvider imports the SDK lazily; install this extra only if that provider is used.
anthropic = [
    "anthropic>=0.40",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
